<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Thử thách</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <!-- 1. Thanh Chuyển Tab Thử Thách -->
    <div class="tab-header">
      <button class="tab-btn active" id="tabGroup">
        <img src="https://via.placeholder.com/30/8b5cf6/ffffff?text=GP" class="tab-icon" alt="Group Icon" />
        <span>Thử thách nhóm</span>
      </button>
      <button class="tab-btn" id="tabPersonal">
        <img src="https://via.placeholder.com/30/10b981/ffffff?text=ME" class="tab-icon" alt="Personal Icon" />
        <span>Thử thách cá nhân</span>
      </button>
    </div>

    <!-- 2. Danh sách Card Thử thách -->
    <div class="challenge-list">
      <!-- Card Thử thách 1 (Ví dụ) -->
      <div class="challenge-card" onclick="openCheckinModal('2026-08-01', 'Dậy sớm')">
        <div class="challenge-title">🔥 Dậy sớm</div>
        
        <!-- YÊU CẦU 2: Đã bỏ icon lịch, chỉ giữ text ngày tháng -->
        <div class="challenge-date">01/08/2026</div>

        <div class="challenge-reward">🎁 +1 Sách | 💸 -100k</div>
      </div>
    </div>
  </div>

  <!-- 3. Modal Check-in -->
  <div class="modal-overlay hidden" id="checkinModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">🔥 Dậy sớm (01/08)</h3>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-body">
        <!-- KHU VỰC CHECK-IN CỦA BẢN THÂN -->
        <div class="my-checkin-card">
          
          <!-- Trạng thái 1: Chưa check-in / Đang chỉnh sửa -->
          <div class="checkin-edit-mode hidden" id="editMode">
            <div class="checkin-option">
              <!-- YÊU CẦU 4A: Chỉ có ô Hoàn thành, không tích chọn sẵn, không có icon bên trong -->
              <label class="custom-checkbox">
                <input type="checkbox" id="chkComplete" />
                <span>Hoàn thành</span>
              </label>
            </div>
            
            <textarea id="txtNote" placeholder='Ghi chú (ví dụ: "add")' rows="2"></textarea>
            
            <div class="action-buttons">
              <button class="btn-submit" onclick="submitCheckin()">Lưu kết quả</button>
            </div>
          </div>

          <!-- Trạng thái 2: Đã check-in (Chế độ xem lại gọn nhẹ) -->
          <div class="checkin-view-mode hidden" id="viewMode">
            <div class="view-header">
              <!-- YÊU CẦU 4C: Cỡ chữ nhỏ bằng thành viên khác -->
              <span class="status-badge status-completed" id="myStatusBadge">
                ✅ Hoàn thành
              </span>

              <!-- YÊU CẦU 4B: Nút chỉnh sửa đổi thành icon cây bút -->
              <button class="btn-edit-icon" id="btnEdit" onclick="enableEditMode()" title="Chỉnh sửa">
                ✏️
              </button>
            </div>

            <div class="view-timestamp" id="viewTimestamp">Cập nhật: 19:04 02/08</div>
            <div class="view-note hidden" id="viewNote"></div>
          </div>

          <!-- Trạng thái 3: Bị KHÓA do quá thời hạn 2 ngày -->
          <div class="checkin-locked-mode hidden" id="lockedMode">
            <div class="view-header">
              <span class="status-badge status-failed">
                ❌ Không hoàn thành
              </span>
            </div>
            <p class="lock-notice">⚠️ Đã quá thời hạn check-in (Sau 00:00 ngày thứ 2).</p>
          </div>

        </div>

        <!-- YÊU CẦU 5: Thành viên khác: 1/2 (Không có space trước dấu 2 chấm) -->
        <div class="members-section">
          <div class="members-header">
            <span class="avatar-mini">👥</span>
            <span>Thành viên khác: 1/2</span>
            <span class="arrow">▲</span>
          </div>

          <div class="members-list">
            <div class="member-item">
              <div class="member-info">
                <span class="member-avatar">B</span>
                <span class="member-name">Bằng <small>(18:13 02/08)</small></span>
              </div>
              <span class="status-badge status-completed">✅ Hoàn thành</span>
            </div>

            <div class="member-item">
              <div class="member-info">
                <span class="member-avatar">V</span>
                <span class="member-name">Vẫn</span>
              </div>
              <!-- Trạng thái của thành viên chưa làm -->
              <span class="status-badge status-pending" id="member2Status">⏳ Chưa làm</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
