<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quản Lý Thử Thách</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            position: relative;
        }

        /* VI/EN Button nhỏ gọn, tinh tế */
        .lang-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            padding: 2px 6px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #64748b;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .lang-btn:hover {
            opacity: 1;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        button.btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button.btn-primary:hover {
            background-color: #1d4ed8;
        }

        .preview-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            background: #f1f5f9;
            box-sizing: border-box;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toast {
            font-size: 13px;
            color: #16a34a;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nút VI/EN được thu nhỏ, tinh tế -->
        <button class="lang-btn" onclick="toggleLang()">VI / EN</button>

        <h2>Quản Lý Thử Thách</h2>

        <div class="form-group">
            <label id="lbl-name">Tên thử thách</label>
            <input type="text" id="challengeName" placeholder="Ví dụ: Đọc sách, Chạy bộ...">
        </div>

        <div class="row">
            <div class="form-group">
                <label id="lbl-status">Trạng thái</label>
                <select id="challengeStatus" onchange="toggleProgressInput()">
                    <option value="doing">Đang thực hiện</option>
                    <option value="done">Hoàn thành</option>
                    <option value="paused">Tạm dừng</option>
                    <option value="givenup">Bỏ cuộc</option>
                    <option value="none">Không tham gia</option>
                </select>
            </div>
            <div class="form-group" id="progressGroup">
                <label id="lbl-progress">Tiến độ (ví dụ: 2/30 ngày)</label>
                <input type="text" id="challengeProgress" placeholder="2/30 ngày">
            </div>
        </div>

        <button class="btn-primary" onclick="addChallenge()" id="btnAdd">Thêm vào danh sách</button>

        <div class="preview-section">
            <label id="lbl-preview">Nội dung xem trước (dành cho Zalo/Messenger)</label>
            <textarea id="outputArea" readonly></textarea>
            <div class="actions">
                <span id="toastMsg" class="toast">Nội dung đã được sao chép vào bộ nhớ tạm.</span>
                <button class="btn-primary" style="width: auto; padding: 8px 16px;" onclick="copyToClipboard()" id="btnCopy">Sao chép</button>
            </div>
        </div>
    </div>

    <script>
        let challenges = [];
        let challengeCount = 0;
        let currentLang = 'vi';

        function toggleProgressInput() {
            const status = document.getElementById('challengeStatus').value;
            const progressGroup = document.getElementById('progressGroup');
            // Tiến độ cần hiển thị khi đang thực hiện, tạm dừng, hoặc bỏ cuộc
            if (status === 'paused' || status === 'givenup' || status === 'doing') {
                progressGroup.style.display = 'block';
            } else {
                progressGroup.style.display = 'none';
            }
        }

        function addChallenge() {
            const name = document.getElementById('challengeName').value.trim();
            const status = document.getElementById('challengeStatus').value;
            const progress = document.getElementById('challengeProgress').value.trim();

            if (!name) {
                alert('Vui lòng nhập tên thử thách!');
                return;
            }

            challengeCount++;
            // Chuyển số thứ tự thành số mũ nhỏ ở cuối tên thử thách
            const superscriptNum = toSuperscript(challengeCount);
            const formattedName = `${name} ${superscriptNum}`;

            challenges.push({ name: formattedName, status, progress });
            
            document.getElementById('challengeName').value = '';
            document.getElementById('challengeProgress').value = '';
            updateOutput();
        }

        function toSuperscript(num) {
            const map = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
            return num.toString().split('').map(char => map[char] || char).join('');
        }

        function updateOutput() {
            // Icon mới cho Thử thách chung và Kết quả
            let text = "🎯 Thử thách chung\n";
            
            challenges.forEach(item => {
                let icon = '';
                let extra = '';

                switch(item.status) {
                    case 'doing':
                        icon = '🔥';
                        if(item.progress) extra = ` (${item.progress})`;
                        break;
                    case 'done':
                        icon = '✅';
                        break;
                    case 'paused':
                        icon = '⏸️';
                        if(item.progress) extra = ` (${item.progress})`;
                        break;
                    case 'givenup':
                        icon = '❌'; // Icon bỏ cuộc riêng biệt
                        if(item.progress) extra = ` (${item.progress})`;
                        break;
                    case 'none':
                        icon = '⚪'; // Icon không tham gia riêng biệt (khác bỏ cuộc)
                        break;
                }

                text += `- ${item.name}: ${icon}${extra}\n`;
            });

            text += "\n📋 Kết quả";

            document.getElementById('outputArea').value = text;
        }

        function copyToClipboard() {
            const textarea = document.getElementById('outputArea');
            textarea.select();
            document.execCommand('copy');

            const toast = document.getElementById('toastMsg');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function toggleLang() {
            currentLang = currentLang === 'vi' ? 'en' : 'vi';
            if (currentLang === 'en') {
                document.getElementById('lbl-name').innerText = 'Challenge Name';
                document.getElementById('lbl-status').innerText = 'Status';
                document.getElementById('lbl-progress').innerText = 'Progress (e.g., 2/30 days)';
                document.getElementById('lbl-preview').innerText = 'Preview Content (for Zalo/Messenger)';
                document.getElementById('btnAdd').innerText = 'Add to list';
                document.getElementById('btnCopy').innerText = 'Copy';
            } else {
                document.getElementById('lbl-name').innerText = 'Tên thử thách';
                document.getElementById('lbl-status').innerText = 'Trạng thái';
                document.getElementById('lbl-progress').innerText = 'Tiến độ (ví dụ: 2/30 ngày)';
                document.getElementById('lbl-preview').innerText = 'Nội dung xem trước (dành cho Zalo/Messenger)';
                document.getElementById('btnAdd').innerText = 'Thêm vào danh sách';
                document.getElementById('btnCopy').innerText = 'Sao chép';
            }
        }
    </script>
</body>
</html>
