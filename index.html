const IMGBB_API_KEY = "bd0a030a81f4c79ab3b1184011f1bd99"; // Thay mã API Key của bạn vào đây

async function uploadToImgbb(base64Image) {
    if (!IMGBB_API_KEY || IMGBB_API_KEY === "bd0a030a81f4c79ab3b1184011f1bd99") {
        console.warn("Chưa cấu hình IMGBB_API_KEY. Ảnh sẽ giữ định dạng Base64.");
        return base64Image;
    }
    try {
        const cleanBase64 = base64Image.replace(/^data:image\/(png|jpg|jpeg|webp);base64,/, '');
        const formData = new FormData();
        formData.append('image', cleanBase64);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        if (data && data.success) {
            return data.data.url;
        } else {
            console.error("ImgBB Error:", data);
            return null;
        }
    } catch (err) {
        console.error("Upload Fetch Error:", err);
        return null;
    }
}

function isChallengeFinished(startDate, totalDays) {
    const s = new Date(startDate || Date.now());
    s.setHours(0, 0, 0, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const endDate = new Date(s);
    endDate.setDate(endDate.getDate() + totalDays);
    return today >= endDate;
}

function isDayLocked(startDate, dayIdx) {
    const todayIdx = getTodayIndex(startDate);
    return dayIdx < todayIdx; 
}

function sortByStartDate(a, b) {
    return new Date(b.startDate || 0) - new Date(a.startDate || 0);
}

function checkLogin() {
    auth.onAuthStateChanged((user) => {
        if (user) {
            processLoginState(user);
        } else {
            loggedInUserId = null;
            document.getElementById('login-modal').classList.remove('hidden');
        }
    });
}

let isProcessingLogin = false;
function processLoginState(user) {
    if(isProcessingLogin || !appData || !appData.members) return;
    isProcessingLogin = true;

    document.getElementById('login-modal').classList.add('hidden');
    
    let isExist = appData.members.some(m => m.id === user.uid);
    let isPending = (appData.pendingMembers || []).some(p => p.id === user.uid);

    if (isExist) {
        if(loggedInUserId !== user.uid) finishGoogleLogin(user.uid);
    } else if (user.email === ADMIN_EMAIL) {
        appData.members.push({ id: user.uid, name: user.displayName || 'Admin', avatar: user.photoURL || '', email: user.email });
        if(!appData.personalHabits) appData.personalHabits = {};
        appData.personalHabits[user.uid] = [];
        dbRef.set(appData);
        finishGoogleLogin(user.uid);
    } else {
        if (!isPending) {
            appData.pendingMembers = appData.pendingMembers || [];
            appData.pendingMembers.push({ id: user.uid, name: user.displayName || 'Thành viên mới', avatar: user.photoURL || '', email: user.email, createdAt: Date.now() });
            
            const adminMember = appData.members.find(m => m.email === ADMIN_EMAIL);
            if(adminMember) sendNotification(adminMember.id, 'pending_approval', 'Hệ thống', 'Thành viên mới', `Tài khoản ${user.email} xin vào nhóm.`);
            
            dbRef.set(appData);
            alert("Yêu cầu tham gia của bạn đã được gửi. Vui lòng chờ Admin phê duyệt!");
        } else {
            alert("Tài khoản của bạn đang chờ Admin phê duyệt. Vui lòng quay lại sau!");
        }
        auth.signOut(); 
    }
    isProcessingLogin = false;
}

// Hàm phát nhạc hiện tại
let backgroundAudio = null;

function playCurrentMusic() {
    const playlist = getPlaylist();
    if (!playlist || playlist.length === 0) return;
    
    if (!backgroundAudio) {
        backgroundAudio = new Audio();
        backgroundAudio.loop = true;
        backgroundAudio.volume = 0.3;
    }
    
    if (backgroundAudio.src !== playlist[currentMusicIndex]) {
        backgroundAudio.src = playlist[currentMusicIndex];
    }
    
    backgroundAudio.play().then(() => {
        isMusicPlaying = true;
    }).catch(err => {
        console.log("Trình duyệt chặn autoplay nhạc:", err);
        isMusicPlaying = false;
    });
}

}

function updateUserLabel() {
    if (!loggedInUserId || !appData || !appData.members) return;

    if (nameEl) {

    const avatarEl = document.getElementById('user-avatar-display');
    if (avatarEl) {
        avatarEl.src = currentUser.avatar || '';
    }
}

function previewProfileAvatar(e) {

async function saveProfileChanges() {
    const mIdx = appData.members.findIndex(x => x.id === loggedInUserId);
    if (mIdx === -1) return;
    const m = appData.members[mIdx];
    const newName = document.getElementById('profile-name-input').value.trim();
    let hasChanged = false;

    if (newName && newName !== m.name) {
        const isExist = appData.members.some(x => x.id !== loggedInUserId && x.name.toLowerCase() === newName.toLowerCase());
        if (isExist) return alert(t('errNameExist'));
        appData.members[mIdx].name = newName;
        (appData.sharedChallenges || []).forEach(c => { if (c.creatorId === loggedInUserId) c.creatorName = newName; });
        hasChanged = true;
    }

    if (tempAvatarBase64 !== (m.avatar || '')) {
        let finalAvatarUrl = tempAvatarBase64;
        if (tempAvatarBase64.startsWith('data:image')) {
            const btn = document.getElementById('profile-save-btn');
            btn.innerText = "Đang tải ảnh..."; btn.disabled = true;
            const url = await uploadToImgbb(tempAvatarBase64);
            btn.innerText = "Lưu Thay Đổi"; btn.disabled = false;
            if (url) { finalAvatarUrl = url; tempAvatarBase64 = url; } else { alert("Lỗi tải ảnh lên ImgBB."); return; }
        }
        appData.members[mIdx].avatar = finalAvatarUrl; 
        hasChanged = true;
    }

    if (hasChanged) { dbRef.set(appData); alert(t('profileSuccess')); updateUserLabel(); renderList(); }
    document.getElementById('profile-modal').classList.add('hidden');
}

function displayRandomSlogan() {
    const el = document.getElementById('random-slogan-text');
    if (!el) return;
    
    // Nếu chưa có dữ liệu slogans, dùng mặc định
    if (!appData.slogansPool || Array.isArray(appData.slogansPool)) {
        appData.slogansPool = { vi: [...defaultSlogans.vi], en: [...defaultSlogans.en] };
    }
    
    let pool = appData.slogansPool[currentLang];
    if (!Array.isArray(pool)) {
        pool = (typeof pool === 'object' && pool !== null) ? Object.values(pool) : [...defaultSlogans[currentLang]];
    }
    
    if (pool && pool.length > 0) {
        const randomItem = pool[Math.floor(Math.random() * pool.length)];
        el.innerText = `"${randomItem}"`;
    } else {
        el.innerText = `"Hành trình vạn dặm khởi đầu từ một bước chân."`;
    }
}

function handleResetTestData() {
    const currentUser = auth.currentUser;
    if (!currentUser || currentUser.email !== ADMIN_EMAIL) return alert(t('notAdmin'));
    const sysCfg = appData.systemConfig || defaultSystemConfig;
    const mp = prompt(t('adminConfirmTitle'));
    if (mp === (sysCfg.masterPin || "0000")) {
        if (!confirm(t('adminConfirmWarn'))) return;
        
        const adminMember = appData.members.find(m => m.email === ADMIN_EMAIL);
        appData.members = adminMember ? [adminMember] : [];
        appData.pendingMembers = [];
        appData.notifications = {};
        appData.sharedChallenges = [];
        appData.personalHabits = adminMember ? { [adminMember.id]: [] } : {};
        appData.systemConfig = defaultSystemConfig;
        appData.playlist = defaultPlaylist;
        appData.slogansPool = defaultSlogans;
        appData.hintsPool = defaultHints;

        dbRef.set(appData); 
        alert(t('adminSuccess')); closeUserMenu(); closeAdminCenterModal();

function updateNotificationBadge() {

    if (!appData.notifications) {
        appData.notifications = {};
    }
    
    const userNotes = appData.notifications[loggedInUserId] || [];
    const unread = Array.isArray(userNotes) ? userNotes.filter(n => n && !n.read).length : 0; 
    
    const b = document.getElementById('notif-badge'); 
    if (b) { 
        if (unread > 0) {
            b.innerText = unread > 9 ? '9+' : unread;
            b.classList.remove('hidden');
        } else {
            b.classList.add('hidden');
        }
    } 
}

function getEndDate(start, total) { const d = new Date(start); d.setDate(d.getDate() + total - 1); return formatDateString(d); }

function formatDateString(date) { const d = new Date(date); return isNaN(d) ? date : `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`; }
function getTodayIndex(start) { const s=new Date(start||Date.now()); s.setHours(0,0,0,0); const tDate=new Date(); tDate.setHours(0,0,0,0); return Math.round((tDate-s)/86400000); }

function getStreakInfo(prog) {
    if (!prog || !prog.length) return { active: 0, max: 0 };
    let maxStreak = 0, currentStreak = 0, activeStreak = 0, countingActive = true;
    for (let i = 0; i < prog.length; i++) { if (prog[i] && prog[i].completed) { currentStreak++; if (currentStreak > maxStreak) maxStreak = currentStreak; } else { currentStreak = 0; } }
    for (let i = prog.length - 1; i >= 0; i--) { if (prog[i] && prog[i].completed) { if (countingActive) activeStreak++; } else { if (activeStreak > 0) countingActive = false; } }
    return { active: activeStreak, max: maxStreak };
}

    const r = new FileReader(); r.onload = e => { const i = new Image(); i.onload = () => { const cv = document.createElement('canvas'); let w = i.width, h = i.height; const MAX_SIZE = 1600; if(w > h){ if(w > MAX_SIZE){ h *= MAX_SIZE / w; w = MAX_SIZE; } } else { if(h > MAX_SIZE){ w *= MAX_SIZE / h; h = MAX_SIZE; } } cv.width = w; cv.height = h; cv.getContext('2d').drawImage(i, 0, 0, w, h); cb(cv.toDataURL('image/jpeg', 0.9)); }; i.src = e.target.result; }; r.readAsDataURL(f);
}

                htmlTxt += `<div class="space-y-1 text-[11px]"><div class="flex justify-between items-center gap-2"><span class="font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 min-w-0 shrink truncate">${getMemberAvatarHTML(m.mId, "w-4 h-4")} <span class="truncate">${m.n}</span></span><span class="font-bold text-slate-600 dark:text-slate-300 shrink-0 flex items-center gap-1">${m.cnt}/${tgt} (${pct}%) ${statusBadge}</span></div><div class="w-full bg-slate-200/70 dark:bg-slate-700/60 rounded-full h-1.5 overflow-hidden"><div class="${barColor} h-full rounded-full transition-all duration-300" style="width: ${Math.min(pct, 100)}%"></div></div>${m.rsn ? `<p class="text-[10px] text-rose-500 italic">${t('txtReason')}: ${m.rsn}</p>` : ''}</div>`;
            });
            htmlTxt += `</div></div>`;
        });
    } else { htmlTxt += `<p class="text-[11px] text-slate-400 italic text-center py-2">${t('noChallenges')}</p>`; }
    htmlTxt += `</div></div>`;

    const myH = (appData.personalHabits[loggedInUserId]||[]).filter(h=>!h.archived).sort(sortByStartDate); const userAv = getMemberAvatarHTML(loggedInUserId, "w-4 h-4");
    htmlTxt += `<div id="act-box-per" class="border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-2xs mt-2"><button onclick="toggleActivityAccordion('per')" class="w-full p-3 bg-emerald-50/80 dark:bg-slate-800/80 flex justify-between items-center font-bold text-xs text-emerald-800 dark:text-emerald-300 hover:bg-emerald-100 transition"><span class="flex items-center gap-1.5">${userAv} ${currentMemberName.toUpperCase()} (${myH.length})</span><span id="act-arrow-per" class="text-xs transition-transform duration-200">▼</span></button><div id="act-content-per" class="p-3 space-y-2 hidden border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">`;

    if(myH.length){
        myH.forEach((h,i) => {
            const tgt = h.targetDays || sysCfg.defaultTargetDays, tot = h.totalDays || sysCfg.defaultTotalDays, cnt = (h.days||[]).filter(x=>x&&x.completed).length, isD = cnt >= tgt, cFinished = isChallengeFinished(h.startDate, tot), isF = h.status==='given_up' || (!isD && cFinished), pct = Math.round((cnt / tgt) * 100);
            let barColor = isF ? 'bg-rose-300 dark:bg-rose-900/60' : (h.status==='paused' ? 'bg-amber-300' : 'bg-emerald-300 dark:bg-emerald-400/80');
            let statusBadge = isF ? `<span class="text-rose-500 font-bold text-[13px] leading-none shrink-0" title="${t('incomplete')}">❌</span>` : (h.status === 'paused' ? `<span class="text-amber-600 font-bold text-[13px] leading-none shrink-0" title="${t('pauseChallenge')}">⏸️</span>` : (isD ? `<span class="text-emerald-600 font-bold text-[13px] leading-none shrink-0" title="${t('completed')}">✅</span>` : `<span class="text-slate-400 font-bold text-[10px] leading-none shrink-0">⏳</span>`));
            htmlTxt += `<div class="p-2.5 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200/80 dark:border-slate-700 space-y-1.5"><div class="flex justify-between items-center text-xs w-full overflow-hidden gap-2"><div class="font-bold text-slate-800 dark:text-slate-100 flex items-center gap-1 min-w-0 shrink"><span class="shrink-0 leading-none">${userAv}</span><span class="truncate">${h.text}</span><sup class="text-emerald-600 font-bold text-[10px] shrink-0">${i+1}</sup><span class="text-[10px] text-slate-400 font-normal shrink-0">[${getDateString(h.startDate, 0)}]</span></div><span class="font-bold text-slate-600 dark:text-slate-300 text-[11px] shrink-0 flex items-center gap-1">${cnt}/${tgt} (${pct}%) ${statusBadge}</span></div><div class="w-full bg-slate-200/70 dark:bg-slate-700/60 rounded-full h-1.5 overflow-hidden"><div class="${barColor} h-full rounded-full transition-all duration-300" style="width: ${Math.min(pct, 100)}%"></div></div>${h.reason ? `<p class="text-[10px] text-slate-400 italic">${t('txtReason')}: ${h.reason}</p>` : ''}</div>`;
        });
    } else { htmlTxt += `<p class="text-[11px] text-slate-400 italic text-center py-2">${t('noHabits')}</p>`; }
    htmlTxt += `</div></div>`; document.getElementById('report-html-preview').innerHTML = htmlTxt;
}

function toggleRewardRulesAccordion() { const ruleBox = document.getElementById('reward-rule-box'); const arrow = document.getElementById('reward-rules-arrow'); if(ruleBox) { ruleBox.classList.toggle('hidden'); if(arrow) arrow.style.transform = ruleBox.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)'; } }

function renderRewardsSummary() {
    const sysCfg = appData.systemConfig || defaultSystemConfig, container = document.getElementById('rewards-summary-list'); container.innerHTML = '';
    appData.members.forEach(m => {

        const sortedGroup = [...(appData.sharedChallenges||[])].filter(c=>!c.archived).sort(sortByStartDate);
        sortedGroup.forEach((c, i) => {
            const tgt = c.targetDays||sysCfg.defaultTargetDays, tot = c.totalDays||sysCfg.defaultTotalDays, dateStr = `[${getDateString(c.startDate, 0)}]`, stat = c.participants ? c.participants[m.id] : null, icon = c.isBigPlay ? '🔥' : '🎯', cFinished = isChallengeFinished(c.startDate, tot);
            if(stat === true || stat === 'given_up') {
                const done = (c.progress&&c.progress[m.id]) ? c.progress[m.id].filter(i=>i&&i.completed).length : 0, isFailed = (stat === 'given_up') || (done < tgt && cFinished);
                if (isFailed) { const p = c.isBigPlay ? (c.customPenalty||0) : sysCfg.defaultPenalty; pen += p; groupLogs.push(`<div class="flex items-center justify-between gap-1 w-full overflow-hidden text-[11px]"><div class="flex items-center gap-1 min-w-0 shrink"><span class="shrink-0 leading-none">${icon}</span> <span class="truncate">${c.title}</span><sup class="text-indigo-600 dark:text-indigo-400 font-bold text-[9px] shrink-0 ml-0.5">${i+1}</sup> <span class="text-[10px] text-slate-400 shrink-0">${dateStr}</span><span class="shrink-0">:</span></div> <span class="font-bold text-rose-600 shrink-0 min-w-0">➔ -${p}k ❌</span></div>`); } 
                else if (done >= tgt) { if(c.isBigPlay){ rew += (c.customReward||0); groupLogs.push(`<div class="flex items-center justify-between gap-1 w-full overflow-hidden text-[11px]"><div class="flex items-center gap-1 min-w-0 shrink"><span class="shrink-0 leading-none">🔥</span> <span class="truncate">${c.title}</span><sup class="text-indigo-600 dark:text-indigo-400 font-bold text-[9px] shrink-0 ml-0.5">${i+1}</sup> <span class="text-[10px] text-slate-400 shrink-0">${dateStr}</span><span class="shrink-0">:</span></div> <span class="font-bold text-amber-600 shrink-0 min-w-0">➔ +${c.customReward||0}k ✅</span></div>`); } else { bookCount++; groupLogs.push(`<div class="flex items-center justify-between gap-1 w-full overflow-hidden text-[11px]"><div class="flex items-center gap-1 min-w-0 shrink"><span class="shrink-0 leading-none">🎯</span> <span class="truncate">${c.title}</span><sup class="text-indigo-600 dark:text-indigo-400 font-bold text-[9px] shrink-0 ml-0.5">${i+1}</sup> <span class="text-[10px] text-slate-400 shrink-0">${dateStr}</span><span class="shrink-0">:</span></div> <span class="font-bold text-emerald-600 shrink-0 min-w-0">➔ +${sysCfg.defaultReward} ✅</span></div>`); } }
            }
        });
        
        if(m.id === loggedInUserId) {
            const sortedPersonal = [...(appData.personalHabits[m.id]||[])].filter(h=>!h.archived).sort(sortByStartDate); const userAv = getMemberAvatarHTML(m.id, "w-3.5 h-3.5");
            sortedPersonal.forEach((h, i) => {
                const tgt = h.targetDays||sysCfg.defaultTargetDays, tot = h.totalDays||sysCfg.defaultTotalDays, dateStr = `[${getDateString(h.startDate, 0)}]`, done = (h.days||[]).filter(i=>i&&i.completed).length, cFinished = isChallengeFinished(h.startDate, tot), isFailed = (h.status === 'given_up') || (done < tgt && cFinished);
                if(isFailed) { personalLogs.push(`<div class="flex items-center justify-between gap-1.5 personal-reward-line w-full overflow-hidden text-[11px]"><div class="flex items-center gap-1.5 min-w-0 shrink"><span class="shrink-0 leading-none">${userAv}</span><span class="font-medium text-slate-700 dark:text-slate-200 truncate">${h.text}</span><sup class="text-emerald-600 dark:text-emerald-400 font-bold text-[9px] shrink-0 ml-0.5">${i+1}</sup><span class="text-[10px] text-slate-400 shrink-0">${dateStr}</span><span class="shrink-0">:</span></div><div class="flex items-center gap-1 font-bold text-rose-600 min-w-0 shrink-0 max-w-[45%] justify-end"><span class="shrink-0">➔ 💸</span><span class="truncate">${h.selfPenalty||''}</span><span class="shrink-0">❌</span></div></div>`); } 
                else if(done >= tgt) { personalLogs.push(`<div class="flex items-center justify-between gap-1.5 personal-reward-line w-full overflow-hidden text-[11px]"><div class="flex items-center gap-1.5 min-w-0 shrink"><span class="shrink-0 leading-none">${userAv}</span><span class="font-medium text-slate-700 dark:text-slate-200 truncate">${h.text}</span><sup class="text-emerald-600 dark:text-emerald-400 font-bold text-[9px] shrink-0 ml-0.5">${i+1}</sup><span class="text-[10px] text-slate-400 shrink-0">${dateStr}</span><span class="shrink-0">:</span></div><div class="flex items-center gap-1 font-bold text-emerald-600 min-w-0 shrink-0 max-w-[45%] justify-end"><span class="shrink-0">➔ 🎁</span><span class="truncate">${h.selfReward||''}</span><span class="shrink-0">✅</span></div></div>`); }
            });
        }
        
        const badges = [];
        if(bookCount>0) badges.push(`<span class="text-emerald-600 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 px-2.5 rounded-full font-bold inline-flex items-center justify-center h-5 leading-none shrink-0 text-[10px]">+${bookCount} ${sysCfg.defaultReward}</span>`);
        if(rew>0) badges.push(`<span class="text-amber-600 bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 px-2.5 rounded-full font-bold inline-flex items-center justify-center h-5 leading-none shrink-0 text-[10px]">+${rew}k</span>`);
        if(!badges.length) badges.push(`<span class="text-slate-500 bg-slate-100 dark:bg-slate-800 px-2.5 rounded-full font-bold inline-flex items-center justify-center h-5 leading-none shrink-0 text-[10px]">0 ${sysCfg.defaultReward}</span>`);
        
        let detailsHTML = "";
        if (groupLogs.length || personalLogs.length) { detailsHTML = `<div class="text-[11px] bg-slate-50 dark:bg-slate-900/60 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/80 space-y-1.5 text-slate-700 dark:text-slate-300">`; if (groupLogs.length) detailsHTML += groupLogs.join(''); if (groupLogs.length && personalLogs.length) { detailsHTML += `<hr class="border-slate-200 dark:border-slate-700/80 my-1.5 opacity-60 personal-reward-line">`; } if (personalLogs.length) detailsHTML += personalLogs.join(''); detailsHTML += `</div>`; } 
        else { detailsHTML = `<p class="text-[10px] italic text-slate-400 text-center py-1">${t('noRewardRecord')}</p>`; }

        container.innerHTML += `<div id="rewards-user-card-${m.id}" class="p-3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2"><div class="flex justify-between items-center gap-2 w-full"><div class="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200 min-w-0 shrink"><span class="shrink-0">${getMemberAvatarHTML(m.id, "w-5 h-5")}</span><span class="truncate text-xs">${m.name}</span></div><div class="flex gap-1.5 items-center min-w-0 flex-wrap justify-end">${badges.join('')} <span class="text-rose-600 bg-rose-100/60 dark:bg-rose-950/50 border border-rose-300 dark:border-rose-800 px-2.5 rounded-full font-bold inline-flex items-center justify-center h-5 leading-none shrink-0 text-[10px]">-${pen}k</span></div></div>${detailsHTML}</div>`;
    });
}

function renderLeaderboardList(c) {
    const sysCfg = appData.systemConfig || defaultSystemConfig, container = document.getElementById('leaderboard-list-container'); if(!container) return; const tgt = c.targetDays || sysCfg.defaultTargetDays;
    const mems = Object.keys(c.participants||{}).filter(m => c.participants[m] === true || c.participants[m] === 'given_up').map(mId => { const u = appData.members.find(x => x.id === mId), prog = (c.progress && c.progress[mId]) ? c.progress[mId] : [], cnt = prog.filter(x => x && x.completed).length, pct = Math.round((cnt / tgt) * 100), streak = getStreakInfo(prog); return { id: mId, name: u ? u.name : mId, cnt, pct, streak: streak.active, isGivenUp: c.participants[mId] === 'given_up' }; }).sort((a, b) => b.cnt - a.cnt);
    if(!mems.length) { container.innerHTML = `<p class="text-center text-slate-400 italic py-6 text-xs">${t('notJoined')}</p>`; return; }

    }).join('');
